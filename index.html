<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桜扉まどか | 画家・作家</title>
  <link rel="canonical" href="https://sakuradomadoka.com/">
  <meta name="description" content="桜扉まどかの公式ポートフォリオ。絵画作品、展示会情報、最新のお知らせ、お問い合わせをご案内します。">
  <meta name="author" content="桜扉まどか">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="桜扉まどか | 画家・作家">
  <meta property="og:description" content="桜扉まどかの公式ポートフォリオ。絵画作品、展示会情報、最新のお知らせをご案内します。">
  <meta property="og:url" content="https://sakuradomadoka.com/">
  <meta property="og:site_name" content="桜扉まどか">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "桜扉まどか",
    "jobTitle": "画家、作家",
    "description": "桜扉まどかの公式ポートフォリオ。絵画作品、展示会情報、最新のお知らせをご案内します。"
  }
  </script>
  <style>
    :root { --ink: #5e384a; --paper: #fff7fa; --accent: #f58ab4; }
    html { scroll-behavior: smooth; }
    body { background: var(--paper); color: var(--ink); font-family: 'Hiragino Kaku Gothic ProN W0', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; font-weight: 300; }
    body:not(.intro-entered) { overflow: hidden; }

    .intro {
      position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
      background: #f5b5ca url('作品1.jpg') center / cover no-repeat;
      transition: opacity 1s cubic-bezier(.7,0,.2,1), visibility 1s;
    }
    .intro::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,10,16,.50), rgba(20,10,16,.05) 55%, rgba(20,10,16,.35)); }
    .intro-entered .intro { opacity: 0; visibility: hidden; pointer-events: none; }
    .intro-inner { position: relative; z-index: 1; width: 100%; height: 100%; display: grid; grid-template-rows: 1fr auto 1fr; padding: 28px; color: #fff; }
    .intro-meta { align-self: start; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
    .enter-button {
      align-self: center; justify-self: center; border: 0; background: transparent;
      color: #fff; width: auto; height: auto; border-radius: 0; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      font-family: inherit; transition: opacity .35s, transform .35s;
    }
    .enter-button:hover { transform: translateY(-3px); background: transparent; }
    .enter-button strong { font-size: clamp(34px, 6vw, 72px); font-family: 'Hiragino Kaku Gothic ProN W0', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; font-weight: 300; letter-spacing: .02em; white-space: nowrap; }
    .enter-button span { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; }

    header { background: var(--paper); box-shadow: none; padding: 28px 4vw; border-bottom: 1px solid #d8d1d4; }
    header h1 { font-family: 'Hiragino Kaku Gothic ProN W0', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; font-weight: 300; }
    nav { position: sticky; top: 0; z-index: 20; background: rgba(245,241,239,.92); backdrop-filter: blur(12px); border-bottom: 1px solid #d8d1d4; }
    nav a { color: var(--ink); margin: 0 2.2vw; padding: 4px 0; text-transform: uppercase; letter-spacing: .12em; font-size: 11px; }
    nav a:hover { color: var(--accent); }
    .container { max-width: 1180px; margin: 0 auto; padding: 60px 4vw 20px; }
    section { margin-bottom: 100px; }
    section h2 { border: 0; font-family: 'Hiragino Kaku Gothic ProN W0', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; font-weight: 300; }
    .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4vw 24px; }
    .gallery-item { background: transparent; border-radius: 0; box-shadow: none; }
    .gallery-item:nth-child(even) { margin-top: 80px; }
    .gallery-item img { height: min(58vw, 620px); background: #d9cbd1; }
    .gallery-item p { text-align: left; padding: 14px 0; font-family: 'Hiragino Kaku Gothic ProN W0', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; font-weight: 300; }
    .box { background: transparent; border-top: 1px solid #c8bec2; border-radius: 0; padding: 24px 0; box-shadow: none; }
    #about .box { max-width: 760px; }
    #about p { font-family: 'Hiragino Kaku Gothic ProN W0', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; font-weight: 300; }
    .social-banners { margin-top: 24px; }
    .social-banner { border-radius: 0; border: 1px solid #b7adb1; color: var(--ink); background: transparent; text-transform: uppercase; letter-spacing: .16em; font-size: 11px; }
    .social-banner:hover { background: var(--ink); color: #fff; filter: none; }
    footer { background: var(--ink); }

    @media (max-width: 650px) {
      .intro-inner { padding: 18px; }
      .enter-button { width: auto; height: auto; }
      nav a { margin: 0 8px; }
      .gallery { grid-template-columns: 1fr; }
      .gallery-item:nth-child(even) { margin-top: 0; }
      .gallery-item img { height: 88vw; }
      section { margin-bottom: 64px; }
    }
  </style>
</head>
<body>
  <div class="intro" aria-label="サイト導入画面">
    <div class="intro-inner">
      <div class="intro-meta"><span>PAINTER / WRITER</span><span>2026</span></div>
      <button class="enter-button" type="button" aria-label="桜扉まどかのサイトを見る">
        <strong>桜扉まどか</strong>
        <span>Madoka Sakurado</span>
      </button>
      <div></div>
    </div>
  </div>
  <header>
    <h1>桜扉まどか</h1>
    <p>画家、作家</p>
  </header>
  <nav>
    <a href="#gallery">ギャラリー</a>
    <a href="#about">自己紹介</a>
    <a href="#exhibitions">展示会</a>
    <a href="#contact">お問い合わせ</a>
  </nav>
  <div class="container">
    <section id="gallery">
      <h2>ギャラリー</h2>
      <div class="gallery">
        <div class="gallery-item">
          <img src="作品1.jpg" alt="作品1">
          <p>Heart shaped hearts</p>
        </div>
        <div class="gallery-item">
          <img src="作品2.jpg" alt="作品2">
          <p>Heartgazing</p>
        </div>
        <div class="gallery-item">
          <img src="作品3.jpg" alt="作品3">
          <p>花殻を摘んで</p>
        </div>
        <div class="gallery-item">
          <img src="作品4.jpg" alt="作品4">
          <p>上書き破損</p>
        </div>
      </div>
    </section>
    <section id="about">
      <h2>自己紹介</h2>
      <div class="box">
        <p>優しさと暴力性を同時に表現できるピンクによって、あなたとわたしとの共鳴という、愛の萌芽を育みたい。</p>
      </div>
    </section>
    <section id="exhibitions">
      <h2>展示会</h2>
      <div class="box exhibition-list">
      </div>
    </section>
    <section id="contact">
      <h2>お問い合わせ</h2>
      <div class="box contact-form">
        <p>メール: madokasakurado@gmail.com</p>
        <div class="social-banners">
          <a class="social-banner instagram" href="https://www.instagram.com/sakuradomadoka/" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a class="social-banner x" href="https://x.com/sakuradomadoka" target="_blank" rel="noopener noreferrer">X</a>
          <a class="social-banner tiktok" href="https://www.tiktok.com/@sakurado.madoka" target="_blank" rel="noopener noreferrer">TikTok</a>
        </div>
      </div>
    </section>
  </div>
  <footer>
    <p>&copy; 2026 桜扉まどか</p>
  </footer>
  <script>
    document.querySelector('.enter-button').addEventListener('click', function () {
      document.body.classList.add('intro-entered');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
